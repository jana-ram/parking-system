name: backend-ci

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high

      # mongodb-memory-server downloads a real mongod and boots a genuine
      # single-node replica set per test file (see backend/README.md) — no
      # external MongoDB service container needed in this job.
      - run: npm test

  loadtest:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # §Z Phase 9 exit criterion: the outage-recovery burst must be absorbed
      # with no lost writes / no errors on every push to main, not just
      # verified once by hand. See loadtest/outageRecoveryBurst.js's header
      # for why latency numbers from this job are informational only.
      - run: npm run loadtest

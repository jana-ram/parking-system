# nginx reverse proxy for the backend API — install to
# /etc/nginx/sites-available/smart-parking-backend.conf, symlink into
# sites-enabled, then `certbot --nginx` fills in the TLS server block (see
# infra/provision.sh — TLS issuance is the one step this automation
# deliberately leaves manual, since it requires DNS to already resolve to
# this host before Let's Encrypt can issue anything).
#
# Replace api.example.com below with the real API hostname before use.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 5m;  # matches express.json({ limit: '5mb' }) in server.js

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # app.set('trust proxy', 1) in server.js trusts exactly this hop —
        # keep nginx as the only reverse proxy in front of the app, or
        # rate-limiting/IP-based checks upstream will read the wrong client IP.
    }
}

# nginx static site config for the Product Owner dashboard (owner-web's
# `vite build` output). Install to
# /etc/nginx/sites-available/smart-parking-owner-web.conf, symlink into
# sites-enabled, then `certbot --nginx` fills in the TLS server block.
#
# Replace admin.example.com below with the real dashboard hostname before use.
# This is a deliberately separate hostname from the API (api.example.com) —
# structurally reinforces the platform/tenant isolation the backend already
# enforces (§1.7): the dashboard is never served from, or CORS-permitted
# into, the tenant-facing surface.

server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    root /srv/smart-parking/parking-system/owner-web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        # SPA fallback — react-router-dom (client-side routing) owns every
        # path under /, so an unknown path still serves index.html rather
        # than a raw nginx 404.
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
